[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elma"
version = "0.1.0"
description = "Electrochemistry Lab Multi-frequency Acquisition: hardware drivers and live signal acquisition for the lab's multi-frequency impedance measurement setup."
authors = [
    {name = "Federico Scarpioni", email = "federicoscarpioni@gmail.com"},
]
maintainers = [
    {name = "Federico Scarpioni", email = "federicoscarpioni@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # The author's own packages are NOT on PyPI (and "multisine" on PyPI is an unrelated project): they
    # have to be installed from GitHub.
    # pyeclab (PEIS/GEIS techniques and their channel), npbuffer (push() data-loss fix), multisine (declared
    # dependencies) and deistools (DMFA/detrending/loader/smoothing) are needed from the nicolopianta forks until the
    # changes are merged upstream (federicoscarpioni/<same name>): the gui-support branch of pyeclab, npbuffer and
    # multisine, and gui-support-v2 of DEIStools (gui-support there still has the older history, based on an earlier
    # upstream main); then switch these four URLs back to the upstream ones (drop "nicolopianta" and the "@branch").
    "pyeclab @ git+https://github.com/nicolopianta/pyeclab.git@gui-support",
    "npbuffer @ git+https://github.com/nicolopianta/npbuffer.git@gui-support",
    "deistools @ git+https://github.com/nicolopianta/DEIStools.git@gui-support-v2",
    "pypicostreaming @ git+https://github.com/federicoscarpioni/pypicostreaming.git",
    "trueformawg @ git+https://github.com/federicoscarpioni/trueformawg.git",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
# multisine design (elma.design, elma.config.load_design): the multisine package and lmfit for phase optimisation
# (galvani, scipy and pandas are declared by the gui-support branch of multisine; not by upstream yet)
design = ["multisine @ git+https://github.com/nicolopianta/multisine.git@gui-support", "lmfit"]
# the graphical interface: elma-gui (Multisine Designer, Experiment Builder, Inspection)
gui = ["PyQt5", "matplotlib", "pandas", "scipy", "lmfit", "galvani", "multisine @ git+https://github.com/nicolopianta/multisine.git@gui-support"]

[project.scripts]
elma-gui = "elma.gui.app:main"

[project.urls]
Repository = "https://github.com/federicoscarpioni/elma.git"
Issues = "https://github.com/federicoscarpioni/elma/issues"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "S", "UP"]
